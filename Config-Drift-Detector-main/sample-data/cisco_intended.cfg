! Cisco IOS Baseline / Intended Network Configuration (Router / Switch)
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Core-Router-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$O0qP.gL2/7p9aG8F1/
!
no aaa new-model
!
ip cef
no ip domain lookup
ip domain name enterprise.net
!
!
vlan 10
 name Production-Data
!
vlan 20
 name Engineering
!
vlan 99
 name Management-VLAN
!
!
interface GigabitEthernet0/0
 description Primary Gateway Interface
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk to Core Switch
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface GigabitEthernet0/2
 description Legacy Server Connection
 ip address 10.0.0.1 255.255.255.0
 shutdown
!
router ospf 10
 router-id 1.1.1.1
 network 192.168.1.0 0.0.0.255 area 0
 network 10.0.0.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
access-list 100 permit ip 192.168.1.0 0.0.0.255 any
access-list 100 deny ip any any
!
line con 0
 exec-timeout 5 0
 logging synchronous
 stopbits 1
line vty 0 4
 transport input ssh
 login local
!
end
